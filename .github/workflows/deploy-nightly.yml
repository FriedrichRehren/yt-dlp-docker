name: Deploy Nightly Image

# Rebuilds the "nightly" tag once a day from the upstream nightly channel.

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-nightly
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve Upstream Nightly
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.upstream.outputs.version }}

    steps:
      - name: Resolve latest upstream nightly release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh release view --repo yt-dlp/yt-dlp-nightly-builds --json tagName --jq .tagName)"
          echo "Latest upstream nightly release: ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy Nightly Image
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    with:
      ytdlp_version: nightly
      version: ${{ needs.resolve.outputs.version }}
      tags: nightly
    secrets: inherit
