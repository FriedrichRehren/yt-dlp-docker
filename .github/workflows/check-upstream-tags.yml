name: Check Upstream Tags

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check Latest Upstream Release
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      version: ${{ steps.check.outputs.version }}
      tags: ${{ steps.check.outputs.tags }}

    steps:
      - name: Check latest upstream release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_IMAGE: docker.io/friedrichrehren/yt-dlp
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ghcr_image="ghcr.io/${owner}/yt-dlp"

          version="$(gh release view --repo yt-dlp/yt-dlp --json tagName --jq .tagName)"

          echo "Latest upstream release: ${version}"
          echo "GHCR image: ${ghcr_image}"
          echo "Docker Hub image: ${DOCKERHUB_IMAGE}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if docker buildx imagetools inspect "${ghcr_image}:${version}" >/dev/null 2>&1; then
            ghcr_exists=true
          else
            ghcr_exists=false
          fi

          if docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${version}" >/dev/null 2>&1; then
            dockerhub_exists=true
          else
            dockerhub_exists=false
          fi

          echo "GHCR tag exists: ${ghcr_exists}"
          echo "Docker Hub tag exists: ${dockerhub_exists}"

          if [ "${ghcr_exists}" = "true" ] && [ "${dockerhub_exists}" = "true" ]; then
            echo "Latest upstream release ${version} is already deployed"
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          echo "tags<<EOF" >> "${GITHUB_OUTPUT}"

          if [ "${ghcr_exists}" = "false" ]; then
            echo "${ghcr_image}:${version}" >> "${GITHUB_OUTPUT}"
            echo "${ghcr_image}:latest" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${dockerhub_exists}" = "false" ]; then
            echo "${DOCKERHUB_IMAGE}:${version}" >> "${GITHUB_OUTPUT}"
            echo "${DOCKERHUB_IMAGE}:latest" >> "${GITHUB_OUTPUT}"
          fi

          echo "EOF" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy Release Image
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      stable: true
      version: ${{ needs.check.outputs.version }}
      tags: ${{ needs.check.outputs.tags }}
    secrets: inherit